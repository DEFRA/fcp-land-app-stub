# Local development stack.
#
#   docker compose up -d                 # Redis + the Defra Identity stub only
#   docker compose --profile app up      # the above plus this app in a container
#
# The app is gated behind `profiles: ["app"]` so `npm run services:up` starts the
# dependencies while the app itself runs host-native with hot reload.
#
# fcp-defra-id-stub stands in for Defra Identity locally. When deployed, point
# DEFRA_ID_WELL_KNOWN_URL at the real Defra Identity tenant instead and drop this
# service entirely.
services:
  fcp-land-app-stub:
    profiles:
      - app
    build:
      context: .
      target: development
    image: fcp-land-app-stub
    container_name: fcp-land-app-stub
    ports:
      - "3000:3000"
      - "9000:9229"
    volumes:
      - ./src:/home/node/src
      - ./package.json:/home/node/package.json
      - ./vite.config.js:/home/node/vite.config.js
    env_file:
      - .env
    environment:
      REDIS_HOST: redis
      DEFRA_ID_WELL_KNOWN_URL: http://fcp-defra-id-stub:3008/idphub/b2c/b2c_1a_cui_cpdev_signupsigninsfi/.well-known/openid-configuration
      # fcp-tp-external-api runs in its own compose stack, not this one, so it's
      # reached via the host rather than a service name on the fcp-land-app network.
      EXTERNAL_API_ENDPOINT: ${EXTERNAL_API_ENDPOINT:-http://host.docker.internal:3001/graphql}
      COGNITO_ENABLED: ${COGNITO_ENABLED:-false}
      COGNITO_DOMAIN: ${COGNITO_DOMAIN:-}
      COGNITO_CLIENT_ID: ${COGNITO_CLIENT_ID:-}
      COGNITO_CLIENT_SECRET: ${COGNITO_CLIENT_SECRET:-}
      COGNITO_SCOPE: ${COGNITO_SCOPE:-fcp-tp-external-api-resource-srv/access}
    # host.docker.internal reaches fcp-tp-external-api's own compose stack from
    # inside this container. It does NOT reach fcp-defra-id-stub's token/JWKS
    # endpoints here (see the WELL_KNOWN_API_HOST_OVERRIDE comment below) - that
    # only matters if you run this service itself via `--profile app`.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - fcp-land-app
    depends_on:
      redis:
        condition: service_healthy
      fcp-defra-id-stub:
        condition: service_healthy

  redis:
    image: redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --dir /data --save 5 1
    networks:
      - fcp-land-app
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  fcp-defra-id-stub:
    image: defradigital/fcp-defra-id-stub
    ports:
      - "3008:3008"
    environment:
      PORT: 3008
      AUTH_MODE: mock
      AUTH_OVERRIDE_FILE: example.data.json
      # By default the stub advertises its token/JWKS endpoints on
      # host.docker.internal, assuming every caller is itself a container. The
      # default local dev flow runs this app host-native (`npm run dev`), which
      # cannot rely on host.docker.internal resolving back to a Docker-published
      # port - only containers get that mapping (via extra_hosts, below).
      # Override back to http://fcp-defra-id-stub:3008 if you run this app with
      # `docker compose --profile app up` instead.
      WELL_KNOWN_API_HOST_OVERRIDE: ${WELL_KNOWN_API_HOST_OVERRIDE:-http://localhost:3008}
    volumes:
      - ./example.data.json:/data/example.data.json
    networks:
      - fcp-land-app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3008/health"]
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 3s

networks:
  fcp-land-app:
    name: fcp-land-app
    driver: bridge

volumes:
  redis_data:
