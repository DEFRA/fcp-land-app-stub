# To set up SonarQube Cloud follow https://github.com/DEFRA/cdp-documentation/blob/main/howto/sonarcloud.md

sonar.projectKey=DEFRA_fcp-land-app-stub
sonar.organization=defra

sonar.links.homepage=https://github.com/DEFRA/fcp-land-app-stub
sonar.links.ci=https://github.com/DEFRA/fcp-land-app-stub/actions
sonar.links.scm=https://github.com/DEFRA/fcp-land-app-stub
